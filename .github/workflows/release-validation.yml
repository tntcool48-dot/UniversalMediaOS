name: Release validation

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
      - name: Restore
        run: dotnet restore UniversalMediaOS.sln
      - name: Build
        run: dotnet build UniversalMediaOS.sln -c Release --no-restore --nologo
      - name: Prepare native media test tools
        shell: pwsh
        run: |
          choco install ffmpeg --version=7.1.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg is unavailable on PATH.' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe is unavailable on PATH.' }
      - name: Test
        run: >-
          dotnet test UniversalMediaOS.sln -c Release --no-build --nologo
          --blame-crash --blame-crash-dump-type mini
          --logger "trx;LogFileName=release-validation.trx"
          --logger "console;verbosity=normal"
      - name: Retain test and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-diagnostics
          path: |
            UniversalMediaOS.Tests.E2E/TestResults/**/*.trx
            UniversalMediaOS.Tests.E2E/TestResults/**/*Sequence*.xml
            UniversalMediaOS.Tests.E2E/TestResults/**/*.dmp
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Python scraper syntax
        run: >-
          python -m py_compile
          UniversalMediaOS.Core/scraper.py
          UniversalMediaOS.Core/book_scraper.py
          UniversalMediaOS.Core/audiovisual_scraper.py

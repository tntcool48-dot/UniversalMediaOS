name: Release validation

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
      - name: Restore
        run: dotnet restore UniversalMediaOS.sln
      - name: Build
        run: dotnet build UniversalMediaOS.sln -c Release --no-restore --nologo
      - name: Test
        run: dotnet test UniversalMediaOS.sln -c Release --no-build --nologo
      - name: Validate Python scraper syntax
        run: >-
          python -m py_compile
          UniversalMediaOS.Core/scraper.py
          UniversalMediaOS.Core/book_scraper.py
          UniversalMediaOS.Core/audiovisual_scraper.py
